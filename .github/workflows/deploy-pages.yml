name: Deploy production to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Re-run regression tests
        run: npm run test:ci

      - name: Run Astro check
        run: npm run check:verify

      - name: Build deployable production artifact
        env:
          ASTROCAVA_LEGAL_OWNER: ${{ secrets.ASTROCAVA_LEGAL_OWNER }}
          ASTROCAVA_LEGAL_IDENTIFIER: ${{ secrets.ASTROCAVA_LEGAL_IDENTIFIER }}
          ASTROCAVA_LEGAL_ADDRESS_LINE_1: ${{ secrets.ASTROCAVA_LEGAL_ADDRESS_LINE_1 }}
          ASTROCAVA_LEGAL_ADDRESS_LINE_2: ${{ secrets.ASTROCAVA_LEGAL_ADDRESS_LINE_2 }}
          ASTROCAVA_LEGAL_EMAIL: ${{ secrets.ASTROCAVA_LEGAL_EMAIL }}
        run: npm run build

      - name: Validate production artifact
        run: npm run check:predeploy

      - name: Record artifact provenance
        run: >-
          node scripts/deployment-provenance.mjs write
          --root dist
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"

      - name: Verify artifact provenance
        run: >-
          node scripts/deployment-provenance.mjs verify
          --root dist
          --commit "${{ github.sha }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke-test production deployment
        run: >-
          node scripts/smoke-deployment.mjs
          --origin https://www.astrocava.com
          --expected-commit "${{ github.sha }}"
          --attempts 12
          --retry-delay-ms 5000

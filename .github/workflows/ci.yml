name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm run test:ci

      - name: Run Astro check
        run: npm run check:verify

      - name: Build synthetic verification artifact
        run: npm run build:verify

      - name: Validate synthetic artifact
        run: npm run check:predeploy:verify
